<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q&A Flashcard Deck</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #ffffff;
      --bg2:     #f5f5f0;
      --bg3:     #eeede8;
      --tx:      #1a1a1a;
      --tx2:     #6b6b67;
      --tx3:     #9b9b97;
      --info-tx: #185fa5;
      --info-bg: #e6f1fb;
      --border:  rgba(0,0,0,0.12);
      --border2: rgba(0,0,0,0.22);
      --border3: rgba(0,0,0,0.35);
      --danger:  #d73a3a;
      --r-md:    8px;
      --r-lg:    12px;
      --font:    -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg:      #1e1e1c; --bg2: #2a2a28; --bg3: #323230;
        --tx:      #f0f0ec; --tx2: #a0a09c; --tx3: #6a6a66;
        --info-tx: #85b7eb; --info-bg: #0c2e4a;
        --border:  rgba(255,255,255,0.1);
        --border2: rgba(255,255,255,0.18);
        --border3: rgba(255,255,255,0.28);
      }
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--tx);
      min-height: 100vh;
      padding: 2rem 1.5rem;
    }

    .container { max-width: 960px; margin: 0 auto; }

    h1 {
      font-size: 22px;
      font-weight: 500;
      margin-bottom: 1.75rem;
      color: var(--tx);
    }

    /* ── Grid ───────────────────────────────────────────────────────── */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
      margin-bottom: 12px;
    }

    .cat-card {
      background: var(--bg);
      border: 0.5px solid var(--border);
      border-radius: var(--r-lg);
      padding: 1.25rem 1rem;
      cursor: pointer;
      transition: border-color .15s, background .15s;
      display: flex;
      flex-direction: column;
      gap: 8px;
      user-select: none;
    }

    .cat-card:hover { border-color: var(--border2); background: var(--bg2); }
    .cat-card.active { border-color: var(--border3); background: var(--bg2); }

    .cat-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

    .cat-name {
      font-size: 15px;
      font-weight: 500;
      color: var(--tx);
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cat-count { font-size: 13px; color: var(--tx2); }

    .cat-chevron {
      font-size: 14px;
      color: var(--tx3);
      margin-top: auto;
      transition: transform .2s;
    }

    .cat-card.active .cat-chevron { transform: rotate(180deg); }

    .add-card {
      border: 0.5px dashed var(--border2);
      background: transparent;
      align-items: center;
      justify-content: center;
      color: var(--tx3);
      font-size: 14px;
      gap: 6px;
      min-height: 108px;
    }

    .add-card:hover { border-color: var(--border3); color: var(--tx2); background: var(--bg2); }

    /* ── Expand panel ───────────────────────────────────────────────── */
    .expand-panel {
      display: none;
      border: 0.5px solid var(--border);
      border-radius: var(--r-lg);
      overflow: hidden;
      background: var(--bg);
      margin-bottom: 1.5rem;
    }

    .expand-panel.open { display: block; }

    .panel-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      border-bottom: 0.5px solid var(--border);
      background: var(--bg2);
      flex-wrap: wrap;
    }

    .panel-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .panel-name { font-size: 15px; font-weight: 500; color: var(--tx); flex: 1; min-width: 100px; }

    .panel-actions { display: flex; gap: 8px; align-items: center; margin-left: auto; }

    /* ── Form elements ──────────────────────────────────────────────── */
    input, textarea, select {
      font-family: var(--font);
      font-size: 14px;
      padding: 0 12px;
      height: 34px;
      border: 0.5px solid var(--border2);
      border-radius: var(--r-md);
      background: var(--bg);
      color: var(--tx);
      outline: none;
      transition: border-color .15s;
    }

    input:focus, textarea:focus, select:focus {
      border-color: var(--tx2);
      box-shadow: 0 0 0 2px rgba(100,100,100,.1);
    }

    textarea { height: auto; padding: 8px 12px; resize: vertical; min-height: 60px; }
    select { cursor: pointer; }

    .panel-search { font-size: 13px; width: 200px; height: 30px; padding: 0 10px; background: var(--bg); }

    button {
      font-family: var(--font);
      font-size: 13px;
      padding: 5px 13px;
      height: 34px;
      border: 0.5px solid var(--border2);
      border-radius: var(--r-md);
      background: transparent;
      color: var(--tx);
      cursor: pointer;
      transition: background .15s, transform .1s;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    button:hover { background: var(--bg2); }
    button:active { transform: scale(.98); }
    button.primary { background: var(--tx); color: var(--bg); border-color: var(--tx); }
    button.primary:hover { opacity: .85; }
    button.danger { color: var(--danger); border-color: transparent; }
    button.danger:hover { border-color: var(--danger); background: transparent; }
    button.icon-btn { padding: 4px 8px; height: auto; border-color: transparent; color: var(--tx3); }
    button.icon-btn:hover { color: var(--tx); border-color: var(--border2); background: transparent; }
    button.icon-btn.del:hover { color: var(--danger); border-color: var(--danger); }

    /* ── Q&A items ──────────────────────────────────────────────────── */
    .qa-item { border-bottom: 0.5px solid var(--border); }
    .qa-item:last-child { border-bottom: none; }

    .qa-question {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      cursor: pointer;
    }

    .qa-question:hover { background: var(--bg2); }

    .q-text { font-size: 14px; color: var(--tx); flex: 1; line-height: 1.5; }

    .q-actions { display: flex; gap: 4px; flex-shrink: 0; align-items: center; }

    .reveal-btn {
      font-size: 11px;
      height: auto;
      padding: 3px 10px;
      border-radius: 999px;
    }

    .reveal-btn.shown {
      background: var(--info-bg);
      color: var(--info-tx);
      border-color: transparent;
    }

    .qa-answer {
      display: none;
      padding: 12px 16px;
      font-size: 14px;
      color: var(--tx2);
      line-height: 1.65;
      border-top: 0.5px dashed var(--border);
      background: var(--bg2);
    }

    .qa-answer.shown { display: block; }

    /* Markdown rendered content */
    .md p                { margin: 0 0 8px; }
    .md p:last-child     { margin-bottom: 0; }
    .md ul, .md ol       { margin: 4px 0 8px 1.4rem; }
    .md li               { margin-bottom: 3px; }
    .md h1,.md h2,.md h3 { font-size: 14px; font-weight: 600; color: var(--tx); margin: 12px 0 4px; }
    .md h1:first-child,
    .md h2:first-child,
    .md h3:first-child   { margin-top: 0; }
    .md strong           { font-weight: 600; color: var(--tx); }
    .md em               { font-style: italic; }
    .md code             { font-family: monospace; font-size: 12px; background: var(--bg3); padding: 1px 5px; border-radius: 4px; }
    .md blockquote       { border-left: 3px solid var(--border2); padding-left: 10px; color: var(--tx3); margin: 6px 0; }

    /* ── Edit form ──────────────────────────────────────────────────── */
    .edit-form {
      display: grid;
      gap: 8px;
      padding: 12px 16px;
      background: var(--bg2);
      border-top: 0.5px solid var(--border);
    }

    .edit-form input, .edit-form textarea { width: 100%; }
    .edit-form .row { display: flex; gap: 8px; }

    /* ── Add card form ──────────────────────────────────────────────── */
    .add-area {
      border: 0.5px dashed var(--border2);
      border-radius: var(--r-lg);
      padding: 1rem 1.25rem;
      margin-top: 0.5rem;
    }

    .add-area summary {
      font-size: 14px;
      font-weight: 500;
      color: var(--tx2);
      cursor: pointer;
      list-style: none;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .add-area summary::-webkit-details-marker { display: none; }

    .add-form { display: grid; gap: 8px; margin-top: 12px; }
    .add-form input, .add-form textarea, .add-form select { width: 100%; }
    .add-form .row { display: flex; gap: 8px; }
    .add-form .row > * { flex: 1; }

    /* ── Misc ───────────────────────────────────────────────────────── */
    .empty { text-align: center; padding: 2rem; color: var(--tx3); font-size: 14px; }

    .meta { font-size: 13px; color: var(--tx2); margin-bottom: 1rem; display: flex; align-items: center; gap: 10px; }

    .spinner {
      width: 13px; height: 13px;
      border: 2px solid var(--border2);
      border-top-color: var(--tx2);
      border-radius: 50%;
      animation: spin .6s linear infinite;
      display: none;
    }

    .spinner.active { display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .toast {
      position: fixed;
      bottom: 1.5rem; right: 1.5rem;
      background: var(--tx); color: var(--bg);
      font-size: 13px;
      padding: 10px 16px;
      border-radius: var(--r-md);
      opacity: 0;
      transition: opacity .2s;
      pointer-events: none;
      z-index: 999;
    }

    .toast.show { opacity: 1; }
  </style>
</head>
<body>
<div class="container">
  <h1>Q&amp;A Flashcard Deck</h1>

  <div class="meta">
    <span id="meta"></span>
    <span class="spinner" id="spinner"></span>
  </div>

  <div class="grid" id="grid"></div>

  <div class="expand-panel" id="panel">
    <div class="panel-header" id="panel-header"></div>
    <div id="panel-body"></div>
  </div>

  <details class="add-area" id="add-area">
    <summary><i class="ti ti-plus"></i> Add a card</summary>
    <div class="add-form">
      <div class="row">
        <input type="text" id="new-q" placeholder="Question">
        <select id="new-cat-sel"><option value="">— Pick category —</option></select>
      </div>
      <div class="row">
        <input type="text" id="new-cat-name" placeholder="Or create new category name">
        <input type="color" id="new-cat-color" value="#7F77DD" title="Category color" style="width:48px;padding:2px 4px;cursor:pointer;flex:0 0 48px;">
      </div>
      <textarea id="new-a" placeholder="Answer"></textarea>
      <button class="primary" onclick="addCard()"><i class="ti ti-check"></i> Add card</button>
    </div>
  </details>
</div>

<div class="toast" id="toast"></div>

<script>
  let allData  = [];
  let activeId = null;
  let shown    = new Set();
  let editing  = null;
  let searches = {};

  // ── Markdown renderer ──────────────────────────────────────────────────────
  function md(text) {
    let s = text
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

    // Headers
    s = s.replace(/^### (.+)$/gm, '<h3>$1</h3>');
    s = s.replace(/^## (.+)$/gm,  '<h2>$1</h2>');
    s = s.replace(/^# (.+)$/gm,   '<h1>$1</h1>');

    // Bold / italic
    s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/\*(.+?)\*/g,     '<em>$1</em>');

    // Inline code
    s = s.replace(/`([^`]+)`/g, '<code>$1</code>');

    // Blockquote
    s = s.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');

    // Numbered lists
    s = s.replace(/((?:^\d+\. .+$\n?)+)/gm, match => {
      const items = match.trim().split('\n')
        .map(l => `<li>${l.replace(/^\d+\. /,'')}</li>`).join('');
      return `<ol>${items}</ol>`;
    });

    // Bullet lists (* or -)
    s = s.replace(/((?:^[*\-] .+$\n?)+)/gm, match => {
      const items = match.trim().split('\n')
        .map(l => `<li>${l.replace(/^[*\-] /,'')}</li>`).join('');
      return `<ul>${items}</ul>`;
    });

    // Paragraphs — blocks separated by blank lines
    s = s.split(/\n{2,}/).map(block => {
      block = block.trim();
      if (!block) return '';
      if (/^<(h[1-3]|ul|ol|blockquote)/.test(block)) return block;
      return '<p>' + block.replace(/\n/g, '<br>') + '</p>';
    }).join('');

    return s;
  }

  // ── API ────────────────────────────────────────────────────────────────────
  async function api(method, path, body) {
    setLoading(true);
    try {
      const res = await fetch(path, {
        method,
        headers: body ? { 'Content-Type': 'application/json' } : {},
        body: body ? JSON.stringify(body) : undefined,
      });
      if (!res.ok) throw new Error(await res.text());
      return res.json();
    } finally {
      setLoading(false);
    }
  }

  async function loadData() {
    allData = await api('GET', '/api/cards');
    syncCatSelect();
    renderGrid();
    renderPanel();
    updateMeta();
  }

  // ── UI helpers ─────────────────────────────────────────────────────────────
  function setLoading(on) {
    document.getElementById('spinner').classList.toggle('active', on);
  }

  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2200);
  }

  function esc(str) {
    return String(str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function updateMeta() {
    const total = allData.reduce((s, c) => s + c.cards.length, 0);
    document.getElementById('meta').textContent =
      `${total} card${total !== 1 ? 's' : ''} across ${allData.length} categor${allData.length !== 1 ? 'ies' : 'y'}`;
  }

  function syncCatSelect() {
    const sel = document.getElementById('new-cat-sel');
    const val = sel.value;
    while (sel.options.length > 1) sel.remove(1);
    allData.forEach(cat => {
      const o = document.createElement('option');
      o.value = cat.id; o.textContent = cat.name;
      sel.appendChild(o);
    });
    sel.value = val;
  }

  // ── Grid ───────────────────────────────────────────────────────────────────
  function renderGrid() {
    const grid = document.getElementById('grid');
    grid.innerHTML = allData.map(cat => `
      <div class="cat-card${activeId === cat.id ? ' active' : ''}"
           onclick="toggleCat(${cat.id})"
           title="${esc(cat.name)}">
        <span class="cat-dot" style="background:${cat.color}"></span>
        <span class="cat-name">${esc(cat.name)}</span>
        <span class="cat-count">${cat.cards.length} question${cat.cards.length !== 1 ? 's' : ''}</span>
        <i class="ti ti-chevron-down cat-chevron" aria-hidden="true"></i>
      </div>
    `).join('') + `
      <div class="cat-card add-card" style="display:flex;flex-direction:column;"
           onclick="document.getElementById('add-area').open=true;document.getElementById('new-cat-name').focus()">
        <i class="ti ti-plus" style="font-size:20px" aria-hidden="true"></i>
        <span>Add category</span>
      </div>`;
  }

  // ── Panel ──────────────────────────────────────────────────────────────────
  function renderPanel() {
    const panel = document.getElementById('panel');
    const active = allData.find(c => c.id === activeId);

    if (!active) {
      panel.classList.remove('open');
      return;
    }

    panel.classList.add('open');

    // Header
    document.getElementById('panel-header').innerHTML = `
      <span class="panel-dot" style="background:${active.color}"></span>
      <span class="panel-name">${esc(active.name)}</span>
      <div class="panel-actions">
        <input class="panel-search" type="search" placeholder="Search…"
               value="${esc(searches[activeId] || '')}"
               oninput="searches[${activeId}]=this.value;renderPanel()"
               onclick="event.stopPropagation()">
        <button class="icon-btn del danger" title="Delete category" onclick="deleteCat(${active.id})">
          <i class="ti ti-trash"></i>
        </button>
      </div>`;

    // Cards
    const q = (searches[activeId] || '').toLowerCase();
    const filtered = active.cards.filter(c =>
      !q || c.question.toLowerCase().includes(q) || c.answer.toLowerCase().includes(q)
    );

    const body = document.getElementById('panel-body');
    if (!filtered.length) {
      body.innerHTML = '<div class="empty">No matches.</div>';
      return;
    }

    body.innerHTML = filtered.map(c => {
      const s = shown.has(c.id);
      const ed = editing === c.id;
      return `<div class="qa-item" id="card-${c.id}">
        <div class="qa-question" onclick="toggleA(${c.id})">
          <span class="q-text">${esc(c.question)}</span>
          <div class="q-actions">
            <button class="reveal-btn${s ? ' shown' : ''}"
                    onclick="toggleA(${c.id});event.stopPropagation()">
              ${s ? 'Hide' : 'Show answer'}
            </button>
            <button class="icon-btn" title="Edit" onclick="startEdit(${c.id});event.stopPropagation()">
              <i class="ti ti-pencil"></i>
            </button>
            <button class="icon-btn del" title="Delete" onclick="deleteCard(${c.id});event.stopPropagation()">
              <i class="ti ti-trash"></i>
            </button>
          </div>
        </div>
        ${ed ? `
          <div class="edit-form">
            <input type="text" id="eq-${c.id}" value="${esc(c.question)}">
            <textarea id="ea-${c.id}">${esc(c.answer)}</textarea>
            <div class="row">
              <button class="primary" onclick="saveEdit(${c.id})"><i class="ti ti-check"></i> Save</button>
              <button onclick="cancelEdit()">Cancel</button>
            </div>
          </div>
        ` : `
          <div class="qa-answer${s ? ' shown' : ''}"><div class="md">${md(c.answer)}</div></div>
        `}
      </div>`;
    }).join('');
  }

  // ── Interactions ───────────────────────────────────────────────────────────
  function toggleCat(id) {
    activeId = activeId === id ? null : id;
    shown.clear();
    editing = null;
    renderGrid();
    renderPanel();
  }

  function toggleA(id) {
    shown.has(id) ? shown.delete(id) : shown.add(id);
    renderPanel();
  }

  function startEdit(id)  { editing = id; renderPanel(); }
  function cancelEdit()   { editing = null; renderPanel(); }

  async function saveEdit(id) {
    const q = document.getElementById(`eq-${id}`).value.trim();
    const a = document.getElementById(`ea-${id}`).value.trim();
    if (!q || !a) return alert('Question and answer cannot be empty.');
    const updated = await api('PUT', `/api/cards/${id}`, { question: q, answer: a });
    allData = allData.map(cat => ({
      ...cat,
      cards: cat.cards.map(c => c.id === id ? { ...c, ...updated } : c),
    }));
    editing = null;
    toast('Card updated');
    renderPanel();
    updateMeta();
  }

  async function deleteCard(id) {
    if (!confirm('Delete this card?')) return;
    await api('DELETE', `/api/cards/${id}`);
    allData = allData.map(cat => ({ ...cat, cards: cat.cards.filter(c => c.id !== id) }));
    shown.delete(id);
    toast('Card deleted');
    renderGrid();
    renderPanel();
    updateMeta();
  }

  async function deleteCat(id) {
    const cat = allData.find(c => c.id === id);
    if (!confirm(`Delete category "${cat.name}" and all its cards?`)) return;
    await api('DELETE', `/api/categories/${id}`);
    allData = allData.filter(c => c.id !== id);
    if (activeId === id) activeId = null;
    toast('Category deleted');
    syncCatSelect();
    renderGrid();
    renderPanel();
    updateMeta();
  }

  async function addCard() {
    const question = document.getElementById('new-q').value.trim();
    const answer   = document.getElementById('new-a').value.trim();
    const selId    = document.getElementById('new-cat-sel').value;
    const newName  = document.getElementById('new-cat-name').value.trim();
    const newColor = document.getElementById('new-cat-color').value;

    if (!question || !answer) return alert('Please fill in a question and answer.');

    let category_id = selId ? Number(selId) : null;

    if (newName) {
      const newCat = await api('POST', '/api/categories', { name: newName, color: newColor });
      allData.push({ ...newCat, cards: [] });
      category_id = newCat.id;
      syncCatSelect();
    }

    if (!category_id) return alert('Please pick or create a category.');

    const card = await api('POST', '/api/cards', { category_id, question, answer });
    allData = allData.map(cat =>
      cat.id === category_id ? { ...cat, cards: [...cat.cards, card] } : cat
    );

    document.getElementById('new-q').value = '';
    document.getElementById('new-a').value = '';
    document.getElementById('new-cat-name').value = '';
    document.getElementById('new-cat-sel').value = '';
    document.getElementById('add-area').removeAttribute('open');

    toast('Card added');
    renderGrid();
    renderPanel();
    updateMeta();
  }

  loadData();
</script>
</body>
</html>
